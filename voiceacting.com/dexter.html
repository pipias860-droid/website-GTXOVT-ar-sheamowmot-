    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #14171c;
            color: #ffffff;
            overflow-x: hidden;
        }

        .navbar {
            width: 100%;
            background: #1a1d24;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 40px;
        }

        .nav-container {
            display: flex;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo img {
            height: 40px;
            object-fit: contain;
            margin-right: 40px;
            cursor: pointer;
        }

        .nav-menu {
            display: flex;
            gap: 25px;
        }

        .nav-item {
            color: #b3b3b3;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-item:hover {
            color: #ffffff;
        }

        .watch-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-placeholder-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
        }

        .play-icon-btn {
            position: relative;
            z-index: 2;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .play-icon-btn:hover {
            transform: scale(1.1);
            background: #ffffff;
        }

        .play-icon-btn::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 12px 0 12px 20px;
            border-color: transparent transparent transparent #14171c;
            margin-left: 5px;
        }

        .movie-details {
            display: flex;
            gap: 30px;
            margin-bottom: 50px;
            background: #1a1d24;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .movie-poster {
            width: 200px;
            min-width: 200px;
            aspect-ratio: 2 / 3;
            background-color: #262a36;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-info-text {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .movie-main-title {
            font-size: 26px;
            font-weight: 600;
            color: #ffffff;
        }

        .movie-meta-tags {
            display: flex;
            gap: 15px;
            color: #b3b3b3;
            font-size: 14px;
        }

        .meta-tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 4px;
            color: #e5e7eb;
        }

        .movie-description {
            color: #d1d5db;
            font-size: 15px;
            line-height: 1.6;
        }

        .recommendations-title {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #f3f4f6;
            border-left: 4px solid #3b82f6;
            padding-left: 10px;
        }

        .movie-grid {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .movie-grid::-webkit-scrollbar {
            display: none;
        }

        .movie-card {
            min-width: calc(14.28% - 12px);
            aspect-ratio: 2 / 3;
            background-color: #262a36;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .movie-card:hover {
            transform: translateY(-4px);
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
